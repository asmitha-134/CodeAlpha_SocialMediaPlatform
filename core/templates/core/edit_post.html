{% load static %}

<!DOCTYPE html>

<html>
<head>
    <title>Edit Post - ConnectHub</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>

<body>

```
<!-- Navigation Bar -->
<nav class="navbar">

    <div class="logo">
        ConnectHub
    </div>

    <div class="nav-links">
        <a href="{% url 'home' %}">🏠 Home</a>
        <a href="{% url 'create_post' %}">➕ Create Post</a>
        <a href="{% url 'profile' %}">👤 My Profile</a>
        <a href="{% url 'search_users' %}">🔎 Search Users</a>
        <a href="{% url 'logout' %}">🚪 Logout</a>
    </div>

</nav>


<div class="container">

    <div class="card">

        <h1>✏️ Edit Post</h1>

        <p>Update your post below.</p>

        <br>

        <form method="POST">

            {% csrf_token %}

            <label for="content">
                <strong>Post Content</strong>
            </label>

            <textarea
                id="content"
                name="content"
                rows="6"
                placeholder="Write something..."
                required
            >{{ post.content }}</textarea>

            <br><br>

            <button type="submit">
                💾 Save Changes
            </button>

        </form>

        <br>

        <a href="{% url 'home' %}">
            ← Cancel
        </a>

    </div>

</div>
```

</body>
</html>
