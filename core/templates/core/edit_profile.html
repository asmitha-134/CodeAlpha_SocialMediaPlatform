{% load static %}

<!DOCTYPE html>

<html>
<head>
    <title>Edit Profile - ConnectHub</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>

<body>

```
<!-- Navigation Bar -->
<nav class="navbar">

    <div class="logo">
        ConnectHub
    </div>

    <div class="nav-links">
        <a href="{% url 'home' %}">🏠 Home</a>
        <a href="{% url 'profile' %}">👤 My Profile</a>
        <a href="{% url 'search_users' %}">🔎 Search Users</a>
        <a href="{% url 'logout' %}">🚪 Logout</a>
    </div>

</nav>


<!-- Edit Profile -->
<div class="container">

    <div class="card">

        <h1>✏️ Edit Profile</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <label for="bio">
                <strong>Bio</strong>
            </label>

            <textarea
                id="bio"
                name="bio"
                rows="5"
                placeholder="Tell us something about yourself..."
            >{{ profile.bio }}</textarea>


            <br><br>


            <label for="profile_picture">
                <strong>Profile Picture</strong>
            </label>

            <input
                id="profile_picture"
                type="file"
                name="profile_picture"
                accept="image/*"
            >


            <br><br>


            {% if profile.profile_picture %}

                <p>
                    <strong>Current Profile Picture:</strong>
                </p>

                <img
                    src="{{ profile.profile_picture.url }}"
                    class="profile-picture"
                    alt="Current profile picture"
                >

                <br><br>

            {% endif %}


            <button type="submit">
                💾 Save Profile
            </button>

        </form>


        <br>

        <a href="{% url 'profile' %}">
            ← Back to Profile
        </a>

    </div>

</div>
```

</body>
</html>
